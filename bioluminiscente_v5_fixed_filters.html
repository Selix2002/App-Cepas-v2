
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg0:#070c16;--bg1:#0b1220;--bg2:#0f1a2e;--bg3:#162038;
  --teal:#00e5b4;--teal2:#00b48e;--teal3:#00e5b422;--teal4:#00e5b411;
  --red:#ff4d6d;--text0:#e8f4f0;--text1:#8ab0a0;--text2:#3a6a5a;--text3:#1e3a30;
  --border:#1a2f28;--border2:#0f2020;
  --row-even:#0b1220;--row-odd:#0d1628;--row-hover:#162038;
  --th-h:33px; --frow-h:32px;
}
body{font-family:'Courier New',monospace;background:var(--bg0);color:var(--text0);font-size:13px;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--bg1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-hex{color:var(--teal);font-size:18px;}
.logo-text{font-size:14px;font-weight:700;color:var(--teal);letter-spacing:2px;}
.logo-sub{font-size:10px;color:var(--text2);letter-spacing:1px;margin-top:1px;}
.topbar-actions{display:flex;gap:8px;}
.btn{padding:5px 14px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.5px;border:none;cursor:pointer;font-family:inherit;}
.btn-create{background:var(--teal);color:var(--bg0);}
.btn-create:hover{background:var(--teal2);}
.btn-ghost{background:transparent;color:var(--text1);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--teal2);color:var(--teal);}
.btn-danger{background:transparent;color:var(--red);border:1px solid #ff4d6d33;}

.layout{display:flex;height:calc(100vh - 52px);overflow:hidden;}

.sidebar{width:190px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-section{padding:10px 14px 4px;font-size:9px;color:var(--text2);letter-spacing:2px;font-weight:700;text-transform:uppercase;}
.sidebar-scroll{flex:1;overflow-y:auto;}
.sidebar-scroll::-webkit-scrollbar{width:3px;}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border);}
.col-item{display:flex;align-items:center;gap:8px;padding:5px 14px;cursor:pointer;border-left:2px solid transparent;transition:background 0.1s;}
.col-item:hover{background:var(--bg3);}
.col-item.active{background:var(--teal4);border-left-color:var(--teal);}
.col-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.col-name{font-size:11px;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.col-item.active .col-name{color:var(--teal);}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.chart-panel{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px 12px;flex-shrink:0;}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.chart-title{font-size:10px;color:var(--text2);letter-spacing:2px;font-weight:700;text-transform:uppercase;}
.chart-col-name{font-size:13px;color:var(--teal);font-weight:700;margin-left:8px;}
.chart-controls{display:flex;gap:8px;}
.chart-type-btn{padding:4px 14px;border-radius:3px;font-size:10px;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;transition:all 0.1s;}
.chart-type-btn.active{background:var(--teal3);border-color:var(--teal2);color:var(--teal);}
.dl-btn{padding:4px 14px;border-radius:3px;font-size:10px;font-weight:700;border:1px solid var(--teal2);background:var(--teal3);color:var(--teal);cursor:pointer;font-family:inherit;}
.dl-btn:hover{background:var(--teal);color:var(--bg0);}
.chart-body-wrap{display:flex;justify-content:center;align-items:center;min-height:150px;}
.chart-empty{width:100%;display:flex;align-items:center;justify-content:center;height:150px;font-size:11px;color:var(--text3);letter-spacing:1px;border:1px dashed var(--border);border-radius:4px;}
.bars-container{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:130px;width:100%;padding:0 8px;}
.chart-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.chart-bar{border-radius:3px 3px 0 0;min-width:36px;}
.chart-bar:hover{opacity:0.75;}
.chart-bar-lbl{font-size:9px;color:var(--text2);white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.chart-bar-val{font-size:10px;color:var(--teal);font-weight:700;}
.pie-container{display:flex;align-items:center;justify-content:center;gap:28px;width:100%;}
.pie-legend{display:flex;flex-direction:column;gap:5px;}
.pie-legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text1);}
.pie-legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.pie-legend-count{color:var(--teal);font-weight:700;margin-left:4px;}

.stats-row{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border);flex-shrink:0;}
.stat-block{flex:1;background:var(--bg1);padding:6px 16px;}
.stat-val{font-size:16px;font-weight:700;color:var(--teal);}
.stat-lbl{font-size:9px;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}

.search-bar-wrap{padding:7px 16px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.search-icon{font-size:13px;color:var(--text2);}
.search-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--text0);font-family:inherit;font-size:12px;padding:5px 12px;outline:none;transition:border-color 0.15s;}
.search-input::placeholder{color:var(--text3);}
.search-input:focus{border-color:var(--teal2);}
.search-count{font-size:10px;color:var(--text2);letter-spacing:1px;white-space:nowrap;}
.search-clear{background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:0 4px;font-family:inherit;}
.search-clear:hover{color:var(--teal);}
.clear-all-btn{padding:3px 12px;border-radius:3px;font-size:10px;font-weight:700;border:1px solid #ff4d6d44;background:transparent;color:var(--red);cursor:pointer;font-family:inherit;white-space:nowrap;}
.clear-all-btn:hover{background:#ff4d6d11;}

/* ── TABLE ── */
.table-wrap{flex:1;overflow:auto;position:relative;}
.table-wrap::-webkit-scrollbar{width:6px;height:6px;}
.table-wrap::-webkit-scrollbar-track{background:var(--bg0);}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.table-wrap::-webkit-scrollbar-thumb:hover{background:var(--teal2);}
.table-wrap::-webkit-scrollbar-corner{background:var(--bg0);}

.data-table{border-collapse:collapse;white-space:nowrap;table-layout:fixed;}
.data-table th,.data-table td{border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);}

/* ── STICKY TH ── */
.data-table th{
  position:sticky;top:0;z-index:50;
  background:var(--bg2);
  font-size:9px;color:var(--text2);letter-spacing:1px;text-transform:uppercase;
  font-weight:700;font-family:inherit;
  padding:7px 8px;user-select:none;cursor:pointer;
  height:var(--th-h);
  border-bottom:1px solid var(--border);
}
.data-table th:hover{color:var(--text1);}
.data-table th.col-selected{background:var(--teal3);border-top:2px solid var(--teal);color:var(--teal);}
.data-table th.sorted{color:var(--teal);}
.data-table th.has-filter{color:var(--teal2);}

/* ── STICKY FILTER CELLS ── */
/* Each td in filter row is sticky at top:33px */
.filter-td{
  position:sticky;top:var(--th-h);z-index:49;
  background:#07111a;
  border-bottom:2px solid var(--teal3);
  padding:3px 3px;
  height:var(--frow-h);
}
.filter-td.col-selected{background:#041210;}

/* ── FROZEN FIRST COL ── */
/* TH first col */
.data-table th.frozen{position:sticky;left:0;top:0;z-index:60;background:var(--bg2);border-right:1px solid var(--teal3);}
.data-table th.frozen.col-selected{background:var(--teal3);}
/* filter-td first col */
.filter-td.frozen{position:sticky;left:0;z-index:59;background:#07111a;border-right:1px solid var(--teal3);}
/* body td first col */
.data-table td.frozen{position:sticky;left:0;z-index:8;background:var(--bg2);border-right:1px solid var(--teal3);}
.data-table tr:nth-child(even) td.frozen{background:var(--bg1);}
.data-table tr:hover td.frozen{background:var(--bg3);}

/* ── BODY TD ── */
.data-table td{font-size:11px;color:var(--text1);padding:5px 8px;font-family:inherit;}
.data-table tr:nth-child(even) td{background:var(--row-even);}
.data-table tr:nth-child(odd) td{background:var(--row-odd);}
.data-table tr:hover td{background:var(--row-hover);}
.data-table td.col-selected{background:#00e5b40d;}
.data-table tr:nth-child(even) td.col-selected{background:#00e5b409;}
.data-table tr:hover td.col-selected{background:#00e5b420;}

/* th inner */
.th-inner{display:flex;align-items:center;gap:4px;}
.th-cb{width:11px;height:11px;border:1px solid var(--text2);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent;transition:all 0.1s;}
.th-cb.checked{background:var(--teal);border-color:var(--teal);}
.th-cb.checked::after{content:'✓';font-size:7px;color:var(--bg0);}
.sort-arrow{font-size:8px;color:var(--text3);}
.sorted .sort-arrow{color:var(--teal);}
.filter-dot{font-size:8px;color:var(--teal);margin-left:1px;}

/* col filter input */
.col-filter-input{
  width:100%;background:transparent;border:none;
  border-bottom:1px solid var(--border);
  color:var(--text0);font-family:inherit;font-size:10px;
  padding:3px 5px;outline:none;transition:border-color 0.15s;
}
.col-filter-input::placeholder{color:var(--text3);font-size:9px;}
.col-filter-input:focus{border-bottom-color:var(--teal);background:#00e5b406;}
.col-filter-input.active{border-bottom-color:var(--teal2);color:var(--teal);}
.col-filter-x{font-size:10px;color:var(--red);cursor:pointer;flex-shrink:0;padding:0 2px;line-height:1;}
.col-filter-x:hover{color:#ff8090;}

/* Pills */
.pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;}
.pill-pos{background:#00e5b422;color:#00e5b4;border:1px solid #00e5b433;}
.pill-neg{background:#ff4d6d22;color:#ff4d6d;border:1px solid #ff4d6d33;}
.pill-ni{background:#3a5a7a22;color:#5a8aaa;border:1px solid #3a5a7a33;}
.hl{background:#00e5b433;color:var(--teal);border-radius:2px;padding:0 1px;}
.no-results{padding:28px;text-align:center;font-size:11px;color:var(--text3);letter-spacing:1px;}
.map-btn{position:fixed;bottom:20px;right:20px;z-index:300;width:48px;height:48px;border-radius:50%;background:var(--teal);color:var(--bg0);border:none;cursor:pointer;font-size:20px;box-shadow:0 0 20px #00e5b444;display:flex;align-items:center;justify-content:center;}
.map-btn:hover{background:var(--teal2);}
</style>

  </div>
</div>

];

const CC=['#00e5b4','#4d9fff','#ff8c42','#a78bfa','#ff4d6d','#00c4a0','#3a8aff','#ffb347','#c084fc','#ff6b8a','#00a888','#2878dd','#ff9830','#9060e0','#ff5277'];
const cc=i=>CC[i%CC.length];

let selCol=-1, chartType='bar', sortCol=0, sortDir=1;
let gq='';                          // global query
let cf=Array(COLS.length).fill(''); // per-column filters

/* ─── util ─── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(text,queries){
  let t=text,out='';
  const q=queries.find(q=>q&&t.toLowerCase().includes(q.toLowerCase()));
  if(!q) return esc(t);
  const idx=t.toLowerCase().indexOf(q.toLowerCase());
  return esc(t.slice(0,idx))+'<span class="hl">'+esc(t.slice(idx,idx+q.length))+'</span>'+esc(t.slice(idx+q.length));
}
function getFreq(ci){const m={};ROWS.forEach(r=>{const v=r[ci]||'N/I';m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function filtered(){
  return ROWS.filter(row=>{
    if(gq&&!row.some(c=>c&&c.toLowerCase().includes(gq.toLowerCase()))) return false;
    for(let i=0;i<COLS.length;i++){if(cf[i]&&!(row[i]||'').toLowerCase().includes(cf[i].toLowerCase())) return false;}
    return true;
  });
}
function activeFilters(){return cf.filter(f=>f).length+(gq?1:0);}

/* ─── sidebar ─── */
function buildSidebar(){
  const sb=document.getElementById('sidebar-cols');sb.innerHTML='';
  COLS.forEach((c,i)=>{
    const d=document.createElement('div');d.className='col-item'+(i===selCol?' active':'');
    d.innerHTML=`<div class="col-dot" style="background:${cc(i)}"></div><span class="col-name" title="${c}">${c}</span>`;
    d.onclick=()=>selectCol(i);sb.appendChild(d);
  });
}

/* ─── column select ─── */
function selectCol(i){
  selCol=(selCol===i)?-1:i;
  buildSidebar();renderChart();buildHead();renderRows();
  document.getElementById('chart-col-name').textContent=selCol>=0?COLS[selCol]:'Ninguna';
  document.getElementById('top-status').textContent=selCol>=0?`Analizando: ${COLS[selCol]} · ${getFreq(selCol).length} categorías`:'Selecciona una columna para analizar';
  document.getElementById('st-sel').textContent=selCol>=0?getFreq(selCol).length:'—';
}

/* ─── chart ─── */
function setChartType(t){
  chartType=t;
  document.getElementById('btn-bar').className='chart-type-btn'+(t==='bar'?' active':'');
  document.getElementById('btn-pie').className='chart-type-btn'+(t==='pie'?' active':'');
  renderChart();
}
function renderChart(){
  const empty=document.getElementById('chart-empty');
  const bars=document.getElementById('chart-bars');
  const pw=document.getElementById('chart-pie-wrap');
  if(selCol<0){empty.style.display='flex';bars.style.display='none';pw.style.display='none';return;}
  empty.style.display='none';
  const freq=getFreq(selCol);const max=freq[0][1];
  if(chartType==='bar'){
    bars.style.display='block';pw.style.display='none';
    bars.innerHTML=`<div class="bars-container">${freq.map(([k,v],i)=>{
      const h=Math.max(14,Math.round((v/max)*120));const c=cc(i);
      return `<div class="chart-bar-wrap"><span class="chart-bar-val">${v}</span><div class="chart-bar" style="height:${h}px;background:${c}44;border:1px solid ${c}88;width:40px;" title="${esc(k)}: ${v}"></div><span class="chart-bar-lbl" title="${esc(k)}">${esc(k)}</span></div>`;
    }).join('')}</div>`;
  } else {
    bars.style.display='none';pw.style.display='block';
    pw.innerHTML=`<div class="pie-container"><canvas id="pie-canvas" width="180" height="150"></canvas><div class="pie-legend" id="pie-legend"></div></div>`;
    setTimeout(()=>{
      const canvas=document.getElementById('pie-canvas');if(!canvas)return;
      const ctx=canvas.getContext('2d');const total=freq.reduce((s,[,v])=>s+v,0);
      const cx=90,cy=75,r=65;let angle=-Math.PI/2;
      freq.forEach(([k,v],i)=>{
        const slice=(v/total)*Math.PI*2;const c=cc(i);
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,angle+slice);ctx.closePath();
        ctx.fillStyle=c+'88';ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.fill();ctx.stroke();
        if(v/total>0.06){const mid=angle+slice/2;ctx.fillStyle='#e8f4f0';ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`${Math.round(v/total*100)}%`,cx+Math.cos(mid)*r*0.68,cy+Math.sin(mid)*r*0.68);}
        angle+=slice;
      });
      ctx.beginPath();ctx.arc(cx,cy,24,0,Math.PI*2);ctx.fillStyle='#0f1a2e';ctx.fill();
      const leg=document.getElementById('pie-legend');
      if(leg) leg.innerHTML=freq.slice(0,8).map(([k,v],i)=>`<div class="pie-legend-item"><div class="pie-legend-dot" style="background:${cc(i)};"></div><span style="max-width:100px;overflow:hidden;text-overflow:ellipsis;" title="${esc(k)}">${esc(k)}</span><span class="pie-legend-count">${v}</span></div>`).join('');
    },0);
  }
}

/* ─── BUILD HEAD (called once + on sort/selCol changes) ─── */
/* The filter row's <td> are individually sticky via .filter-td class */
function buildHead(){
  const thead=document.getElementById('table-head');
  thead.innerHTML='';

  /* --- row 1: TH labels --- */
  const trTh=document.createElement('tr');
  COLS.forEach((c,i)=>{
    const th=document.createElement('th');
    th.style.width=COL_W[i]+'px';th.style.minWidth=COL_W[i]+'px';
    const isSel=i===selCol;const hasFil=!!cf[i];const isSort=i===sortCol;
    let cls='';
    if(i===0) cls+='frozen ';
    if(isSel) cls+='col-selected ';
    if(isSort) cls+='sorted ';
    if(hasFil&&!isSel) cls+='has-filter ';
    th.className=cls.trim();
    th.innerHTML=`<div class="th-inner">
      <div class="th-cb${isSel?' checked':''}" onclick="event.stopPropagation();selectCol(${i})"></div>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;">${esc(c)}${hasFil?'<span class="filter-dot">●</span>':''}</span>
      <span class="sort-arrow">${isSort?(sortDir>0?'↑':'↓'):'↕'}</span>
    </div>`;
    th.onclick=()=>{if(sortCol===i)sortDir*=-1;else{sortCol=i;sortDir=1;}buildHead();renderRows();};
    trTh.appendChild(th);
  });
  thead.appendChild(trTh);

  /* --- row 2: filter inputs — each TD is sticky individually --- */
  const trFil=document.createElement('tr');
  COLS.forEach((c,i)=>{
    const td=document.createElement('td');
    const isSel=i===selCol;const hasVal=!!cf[i];
    let cls='filter-td';
    if(i===0) cls+=' frozen';
    if(isSel) cls+=' col-selected';
    td.className=cls;
    td.style.width=COL_W[i]+'px';td.style.minWidth=COL_W[i]+'px';

    if(i===0){
      // icon cell — no input
      td.style.textAlign='center';
      td.innerHTML=`<span style="font-size:12px;color:var(--text2);" title="Filtros por columna">⊟</span>`;
    } else {
      const inp=document.createElement('input');
      inp.type='text';
      inp.id=`cf-${i}`;
      inp.className='col-filter-input'+(hasVal?' active':'');
      inp.placeholder='…';
      inp.value=cf[i];
      inp.title=`Filtrar: ${c}`;
      // KEY FIX: use oninput, do NOT rebuild thead — only renderRows
      inp.addEventListener('input',function(){
        cf[i]=this.value.trim();
        this.className='col-filter-input'+(cf[i]?' active':'');
        // update dot in TH without full rebuild
        updateThDot(i);
        renderRows();
        updateMeta();
      });
      td.appendChild(inp);
      if(hasVal){
        const x=document.createElement('span');
        x.className='col-filter-x';x.textContent='✕';x.title='Limpiar';
        x.onclick=()=>{cf[i]='';inp.value='';inp.className='col-filter-input';updateThDot(i);renderRows();updateMeta();};
        td.appendChild(x);
      }
    }
    trFil.appendChild(td);
  });
  thead.appendChild(trFil);
}

/* update just the dot indicator on a TH without full rebuild */
function updateThDot(i){
  const ths=document.querySelectorAll('#table-head tr:first-child th');
  const th=ths[i];if(!th) return;
  const hasFil=!!cf[i];const isSel=i===selCol;
  // toggle class
  th.classList.toggle('has-filter',hasFil&&!isSel);
  // update dot inside
  const span=th.querySelector('.filter-dot');
  if(hasFil&&!span){
    const s=document.createElement('span');s.className='filter-dot';s.textContent='●';
    th.querySelector('.th-inner span').appendChild(s);
  } else if(!hasFil&&span){
    span.remove();
  }
  // update x button in filter row
  const filterTds=document.querySelectorAll('#table-head tr:nth-child(2) td');
  const ftd=filterTds[i];if(!ftd||i===0) return;
  let x=ftd.querySelector('.col-filter-x');
  if(hasFil&&!x){
    x=document.createElement('span');x.className='col-filter-x';x.textContent='✕';x.title='Limpiar';
    const inp=ftd.querySelector('input');
    x.onclick=()=>{cf[i]='';inp.value='';inp.className='col-filter-input';updateThDot(i);renderRows();updateMeta();};
    ftd.appendChild(x);
  } else if(!hasFil&&x){
    x.remove();
  }
}

/* ─── RENDER ROWS ONLY (no thead touch) ─── */
function renderRows(){
  const tbody=document.getElementById('table-body');
  const noRes=document.getElementById('no-results');
  const rows=filtered().sort((a,b)=>{
    const av=a[sortCol]||'',bv=b[sortCol]||'';
    const n=parseFloat(av),m=parseFloat(bv);
    if(!isNaN(n)&&!isNaN(m)) return (n-m)*sortDir;
    return av.localeCompare(bv)*sortDir;
  });
  document.getElementById('st-shown').textContent=rows.length;
  if(rows.length===0){tbody.innerHTML='';noRes.style.display='block';return;}
  noRes.style.display='none';
  tbody.innerHTML='';
  rows.forEach(row=>{
    const tr=document.createElement('tr');
    row.forEach((cell,i)=>{
      const td=document.createElement('td');
      if(i===0) td.className='frozen';
      if(i===selCol) td.classList?td.classList.add('col-selected'):td.className+=' col-selected';
      const raw=cell||'';
      const queries=[gq,cf[i]].filter(Boolean);
      if(raw==='+'){ td.innerHTML='<span class="pill pill-pos">+</span>';}
      else if(raw==='–'||raw==='-'){ td.innerHTML='<span class="pill pill-neg">–</span>';}
      else if(raw==='N/I'){ td.innerHTML='<span class="pill pill-ni">N/I</span>';}
      else{ td.innerHTML=hl(raw,queries);}
      if(i===0){td.style.fontWeight='700';td.style.color='var(--teal)';}
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

/* ─── meta stats & clear btn ─── */
function updateMeta(){
  const n=activeFilters();
  document.getElementById('st-af').textContent=n;
  document.getElementById('clear-all-btn').style.display=n>0?'block':'none';
  const cnt=document.getElementById('search-count');
  cnt.textContent=n>0?`${filtered().length} / ${ROWS.length} cepas`:'';
}

/* ─── global search ─── */
document.getElementById('search-input').addEventListener('input',function(){
  gq=this.value.trim();
  document.getElementById('search-clear').style.display=gq?'block':'none';
  renderRows();updateMeta();
});
document.getElementById('search-clear').onclick=()=>{
  document.getElementById('search-input').value='';gq='';
  document.getElementById('search-clear').style.display='none';
  renderRows();updateMeta();
};
document.getElementById('clear-all-btn').onclick=()=>{
  cf=Array(COLS.length).fill('');gq='';
  document.getElementById('search-input').value='';
  document.getElementById('search-clear').style.display='none';
  buildHead();renderRows();updateMeta();
};

/* ─── init ─── */
buildSidebar();renderChart();buildHead();renderRows();updateMeta();
</script>
