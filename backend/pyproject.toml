[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litestar[standard]",
    "beanie", # ODM para MongoDB con soporte async
    "motor", # Driver async de MongoDB
    "pydantic-settings",
    "uvicorn",
    "bcrypt>=5.0.0",
    "redis>=7.2.0",
    "pyjwt>=2.11.0",
    "httpx>=0.28.1",
    "sentence-transformers>=5.2.3",
    "openpyxl>=3.1.5",
    "torch>=2.10.0",  # se resuelve desde el índice CPU (server sin GPU) — ver [tool.uv.sources]
]

# Server sin GPU → torch en su build CPU (evita ~2-3 GB de nvidia-*/cuda-*/triton que
# nunca se cargan). El índice se marca explicit=true para usarlo SOLO para torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
